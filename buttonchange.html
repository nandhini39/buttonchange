<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level 1 Task 2</title>
  <style>
    button { padding: 10px; margin: 10px; }
  </style>
</head>
<body>
  <h2>JavaScript Task</h2>

  <!-- Color Change -->
  <button onclick="changeColor(this)">Click Me</button>

  <!-- Greeting -->
  <button onclick="showGreeting()">Show Greeting</button>

  <!-- Calculator -->
  <h3>Calculator</h3>
  <input id="num1" type="number" placeholder="Number 1">
  <input id="num2" type="number" placeholder="Number 2">
  <button onclick="calculate()">Add</button>
  <p id="result"></p>

  <script>
    function changeColor(btn) {
      btn.style.backgroundColor = "lightgreen";
    }

    function showGreeting() {
      let hour = new Date().getHours();
      let msg = (hour < 12) ? "Good Morning!" : (hour < 18) ? "Good Afternoon!" : "Good Evening!";
      alert(msg);
    }

    function calculate() {
      let a = parseFloat(document.getElementById("num1").value);
      let b = parseFloat(document.getElementById("num2").value);
      document.getElementById("result").innerText = "Result: " + (a + b);
    }
  </script>
</body>
</html>
